# --- Prefix ---
unbind C-b
set -g prefix `
# pressing prefix key (`) twice switches to the last window
bind-key ` last-window
# for backtick - press `prefix + e`
bind-key e send-prefix

# --- Terminal & true-color rendering ---
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Do not inherit a recovery tool's monochrome setting into terminal panes.
set-environment -gu NO_COLOR

# Pane titles aid navigation when several agents share a topic window.
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_index} #{?@agent-label,#{@agent-label},#{pane_title}} '

# --- Focus events ---
set -g focus-events on

# --- Claude Code attention detection ---
set -g allow-passthrough on
setw -g monitor-bell on
set -g bell-action other
set-hook -g pane-focus-in 'set -pu window-style'
set-hook -g alert-bell 'refresh-client -S'

# Safety valve: clear every attention flag at once, for the rare case where a hook
# did not get to run. Flags normally die with their pane, so this is belt-and-braces.
bind A run-shell 'tmux list-panes -a -F "##{pane_id}" | xargs -n1 -I{} tmux set -pu -t {} @cc_attn' \; display-message "Cleared Claude Code attention flags"

# --- Clipboard ---
set -g set-clipboard external
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell "command -v pbcopy" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard 2>/dev/null || cat > /dev/null'"

# --- Mouse ---
set -g mouse on

# Wheel scroll enters copy-mode WITHOUT -e. The tmux default is `copy-mode -e`,
# which exits again the moment you scroll back to the bottom, so fast up/down
# wheeling repeatedly clones and tears down the copy-mode screen. That churn is
# what triggers the tmux 3.7b server crash on macOS (SIGABRT in grid_free_line
# via window_copy_clone_screen — tmux/tmux#5385; root cause is the system
# malloc, fixed upstream by linking jemalloc, not yet in a tagged release).
# Entering once and staying put keeps wheel scrollback working while cutting
# the exposure. Press q or Escape to leave copy-mode.
#
# `-t =` is load-bearing: it targets the pane under the mouse, and propagates
# to the inner commands. Without it both the condition and copy-mode read the
# *active* pane instead, so any window whose active pane runs a mouse-reporting
# / alt-screen app (Claude Code, vim, less) matches the condition and swallows
# every wheel event window-wide through send-keys -M — scrollback looks dead
# even over a plain shell pane.
bind -T root WheelUpPane \
  if-shell -F -t = "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } { copy-mode }

# Mouse selection -> system clipboard. Explicit pbcopy rather than relying on
# `set-clipboard external` + OSC 52, so it works regardless of the outer
# terminal. Mirrors the `y` binding above.
if-shell "command -v pbcopy" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
   bind -T copy-mode-vi DoubleClick1Pane select-pane \\; send-keys -X select-word \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
   bind -T copy-mode-vi TripleClick1Pane select-pane \\; send-keys -X select-line \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy'"

# --- Window/pane numbering ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Automatic window naming ---
set -g automatic-rename on
set -g status-interval 15
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#(BRANCH=$(git -C "#{pane_current_path}" branch --show-current 2>/dev/null); [ -z "$BRANCH" ] && BRANCH=$(git -C "#{pane_current_path}" rev-parse --short HEAD 2>/dev/null); DIR=$(basename "#{pane_current_path}"); [ -n "$BRANCH" ] && echo "$DIR:$BRANCH" || echo "$DIR")}'

# --- Navigation ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status bar ---
set -g status-position bottom
set -g status-style bg=colour234,fg=colour137,dim
# current session (bold blue) + other sessions (dimmed)
set -g status-left '#[fg=colour255,bg=colour33,bold] #S #[fg=colour153,bg=colour33,nobold](#(tmux list-sessions 2>/dev/null | wc -l | tr -d " "))#[default] '
set -g status-left-length 40
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M '
set -g status-right-length 50
set -g history-limit 50000

# Size windows only against clients viewing them. This is not a fix for
# tmux 3.7c's redraw-range livelock (#5510); use the upstream backport.
# See docs/TMUX_RECOVERY.md for the pinned build and upgrade procedure.
set -g aggressive-resize on

# --- Current window: same hue, inverted so it actually reads ---
# Was fg=colour81,bg=colour238: light-cyan text on #444444 charcoal, sitting on a
# #1c1c1c status bar. Two near-black greys side by side is barely any contrast.
# Inverting keeps the cyan identity but puts it in the background where it carries.
setw -g window-status-current-style fg=colour232,bg=colour81,bold
setw -g window-status-current-format ' #I#[fg=colour23]:#[fg=colour232,bold]#W#[fg=colour23]#F '

setw -g window-status-style fg=colour138,bg=colour235

# --- Background windows: orange when a Claude Code in them is blocked on you ---
# Driven by @cc_attn, a *pane* option that the Claude Code Notification hooks in
# ~/.claude/settings.json set, and its lifecycle hooks (UserPromptSubmit/PostToolUse/
# Stop/SessionEnd) clear. #{P:x,y} aggregates it over every pane in the window --
# x for the inactive panes, y for the active one -- so the tab is orange while ANY
# pane is waiting. Pane-scoped rather than window-scoped is load-bearing: windows
# here routinely run two Claude Code instances, and with one shared window option
# the busy one's PostToolUse would wipe the blocked one's flag milliseconds after
# it was set. It also self-cleans -- a pane option dies with its pane, so a Claude
# that is SIGKILLed cannot strand an orange tab.
#
# Deliberately NOT driven by the bell any more. tmux only latches a bell into
# window-status-bell-style when the window is not current at the instant it rings
# (alerts_check_bell: `if (wl->session->curw != wl) wl->flags |= WINLINK_BELL`), and
# switching away afterwards does not resurrect it. So every prompt raised while you
# were already looking at that window was dropped on the floor -- which is why the
# tab lit up only in the minority case where you happened to be elsewhere.
#
# Style attributes inside a #{?...} branch MUST be space-separated: tmux splits
# conditional arguments on commas, so #[fg=x,bg=y] would be torn in half. The comma
# inside #{P:...} is safe -- that one is protected by its own #{} nesting.
setw -g window-status-format '#{?#{P:#{@cc_attn},#{@cc_attn}},#[fg=colour232 bg=colour208 bold] ● #I:#W#F , #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F }'

# Both neutralised so nothing else competes with the orange above.
#  - bell rang for *every* notification, idle included, so a finished window looked
#    identical to a blocked one. The \a is still emitted for the terminal's own
#    urgency hint; it just no longer colours the tab.
#  - activity's default `reverse` swaps window-status-style to bg=colour138
#    (#af8787 -- a tan that reads as washed-out orange) on *any* output in a
#    background window. That was the orange that showed up at random.
setw -g window-status-bell-style default
setw -g window-status-activity-style default

# --- Activity monitoring ---
# Still on: it drives the '#' marker in #F. Only the colouring above is suppressed.
setw -g monitor-activity on
set -g visual-activity off

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Cheat sheet popup ---
unbind ?
bind ? display-popup -w 80% -h 70% -E "less ~/.config/tmux/cheatsheet.txt"

# --- Git worktree integration ---
bind g display-popup -w 80% -h 60% -E '\
  if ! git rev-parse --git-dir >/dev/null 2>&1; then \
    echo "Not a git repository"; read -n 1; exit 1; \
  fi; \
  if ! command -v fzf >/dev/null 2>&1; then \
    echo "fzf not installed"; read -n 1; exit 1; \
  fi; \
  selected=$(git worktree list | fzf --prompt="worktree> " --height=100% --reverse); \
  if [ -n "$selected" ]; then \
    dir=$(echo "$selected" | awk "{print \$1}"); \
    tmux send-keys "cd \"$dir\" && clear" Enter; \
  fi'

bind G display-popup -w 80% -h 40% -E '\
  if ! git rev-parse --git-dir >/dev/null 2>&1; then \
    echo "Not a git repository"; read -n 1; exit 1; \
  fi; \
  printf "Branch name: "; read branch; \
  if [ -z "$branch" ]; then exit 0; fi; \
  base=$(git rev-parse --show-toplevel); \
  wt_dir="${base}/.worktrees/${branch}"; \
  git worktree add "$wt_dir" -b "$branch" 2>&1; \
  if [ $? -eq 0 ]; then \
    tmux new-window -c "$wt_dir"; \
  else \
    echo ""; echo "Press any key..."; read -n 1; \
  fi'

# --- Sessionizer (fuzzy project switcher) ---
bind f display-popup -w 80% -h 60% -E '\
  dirs=$(find ~/fun -mindepth 1 -maxdepth 1 -type d 2>/dev/null; find ~/work -mindepth 1 -maxdepth 2 -type d 2>/dev/null); \
  dirs=$(echo "$dirs" | sort); \
  selected=$(echo "$dirs" | fzf --prompt="project> " --height=100% --reverse); \
  if [ -n "$selected" ]; then \
    name=$(basename "$selected" | tr "." "_"); \
    if tmux has-session -t="$name" 2>/dev/null; then \
      tmux switch-client -t "$name"; \
    else \
      tmux new-session -d -s "$name" -c "$selected" && tmux switch-client -t "$name"; \
    fi; \
  fi'

# --- Session switcher (running sessions only) ---
# ## escapes prevent tmux from pre-expanding #{} before the shell sees it
bind S display-popup -w 60% -h 40% -E \
  'tmux list-sessions -F "##{session_name}##{?session_attached, (attached),}" | fzf --prompt="session> " --height=100% --reverse | cut -d" " -f1 | xargs -r tmux switch-client -t'

# Right-click on session name → session management menu (Rename, New, Kill + fzf switcher)
bind-key -n MouseDown3StatusLeft display-menu -T "#[align=centre]#{session_name}" -t = -x M -y W \
  "Next Session"   n "switch-client -n" \
  "Prev Session"   p "switch-client -p" \
  "" \
  "Rename Session" r "command-prompt -I '#S' { rename-session '%%' }" \
  "New Session"    s "new-session" \
  "Kill Session"   X "confirm-before -p 'Kill #S? (y/n)' kill-session" \
  "Detach"         d "detach-client" \
  "" \
  "Switch (fzf)..."  f "display-popup -w 60% -h 40% -E 'tmux list-sessions -F \"##{session_name}##{?session_attached, (attached),}\" | fzf --prompt=\"session> \" --height=100% --reverse | cut -d\" \" -f1 | xargs -r tmux switch-client -t'"

# --- Plugin Manager (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- tmux-resurrect ---
set -g @resurrect-capture-pane-contents 'on'

# --- tmux-continuum ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Exact conversation recovery; helper is deployed by chezmoi on desktops.
# Keep server-only Ansible installs usable when the optional helper is absent.
if-shell 'test -x "$HOME/.local/bin/agent-resume"' {
    set -g @resurrect-hook-post-save-layout '~/.local/bin/agent-resume --save'
    set -g @resurrect-processes '~agent-resume'
}

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
