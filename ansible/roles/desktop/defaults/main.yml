---
# Default variables for desktop role

# Sway/Wayland packages
sway_packages:
  - sway
  - wayland-protocols
  - xwayland
  - swayidle
  - swaylock
  - swayimg
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - wl-clipboard
  - grim
  - slurp
  - wofi
  - foot  # Lightweight Wayland terminal for bootstrap (alacritty built later via cargo)

# Audio/Bluetooth packages
audio_packages_debian:
  - bluez
  - blueman
  - pipewire
  - pipewire-audio
  - wireplumber
  - pavucontrol
  - alsa-utils
  - playerctl

# Desktop tool build dependencies
desktop_build_deps:
  - build-essential
  - pkg-config
  - libssl-dev
  - libsensors-dev
  - libpulse-dev
  - libnotmuch-dev
  - pandoc
  - cmake
  - libxcb-shape0-dev
  - libxcb-xfixes0-dev
  - libxkbcommon-dev
  - libwayland-dev
  - libegl-dev
  - libgles-dev
  - libfreetype-dev
  - libfontconfig-dev
  - libdbus-1-dev

# Nerd Fonts to install
nerd_fonts:
  - 0xProto
  - FiraCode
  - Hack
  - Meslo
  - AnonymousPro
  - IntelOneMono

# Input method packages
input_packages:
  - fcitx5
  - fcitx5-mozc

# Power management and utilities
power_packages:
  - tlp
  - brightnessctl
  - wireguard

# Vendors that ship an official install script, run through the shared
# common/install_from_script.yml flow. Linux only — macOS gets all of these
# from Homebrew (see desktop_apps.yml).
desktop_script_installers:
  - name: starship
    url: https://starship.rs/install.sh
    creates: /usr/local/bin/starship
    args: -y
    become: true
  - name: herdr
    url: https://herdr.dev/install.sh
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/herdr"

# Alacritty — built from source on every platform.
#
# The Homebrew cask was disabled on 2026-09-01 (disable_reason:
# fails_gatekeeper_check): upstream ships ad-hoc-signed macOS builds with no
# Apple Developer ID and no notarization, which Homebrew's cask policy no
# longer accepts. It will not come back unless upstream starts notarizing, so
# macOS builds from source like Linux already did. Bump this to upgrade; both
# platforms track the same release tag.
alacritty_version: "0.17.0"

# Alacritty's own Linux build deps (upstream INSTALL.md, plus Wayland). These
# overlap desktop_build_deps, but alacritty.yml runs independently of the
# cargo-tools play so it declares what it needs rather than relying on it.
alacritty_build_deps_debian:
  - cmake
  - pkg-config
  - python3
  - libfreetype-dev
  - libfontconfig-dev
  - libxcb-xfixes0-dev
  - libxkbcommon-dev
  - libwayland-dev
  - libegl-dev
  - libgles-dev
