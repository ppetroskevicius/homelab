---
# Main orchestration for cloud_tools role
# On work-mac, only GCP CLI, Terraform and the gh-stack extension are installed (other tools
# are managed externally).
# Terraform here is only for a work project's optional pubsub-topics flow (targets
# a local env dir, which has no required_version constraint). Actual infra
# plan/apply for that project's infra repo still goes through its own pinned Terraform version.

- name: Install AWS CLI
  ansible.builtin.include_tasks: aws_cli.yml
  when: not (is_work_mac | default(false))

- name: Install GCP CLI
  ansible.builtin.include_tasks: gcp_cli.yml

- name: Install Terraform
  ansible.builtin.include_tasks: terraform.yml

- name: Install GitHub CLI
  ansible.builtin.include_tasks: github_cli.yml
  when: not (is_work_mac | default(false))

# Not gated on work-mac: gh is installed there by the common role (Homebrew), and
# stacked PRs are needed for work repos.
- name: Install gh-stack extension
  ansible.builtin.include_tasks: gh_stack.yml

- name: Install additional utilities
  ansible.builtin.include_tasks: utilities.yml
  when: not (is_work_mac | default(false))
